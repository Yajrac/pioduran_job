# /etc/nginx/sites-available/pioduran-job  (domain setup)
# Start with HTTP only; `certbot --nginx -d pioduranjobportal.com -d www.pioduranjobportal.com`
# then adds the HTTPS (443) block and the http->https redirect, like the Comelec and Water sites.
server {
    listen 80;
    server_name pioduranjobportal.com www.pioduranjobportal.com;

    client_max_body_size 12M;

    # Resumes, cover letters and application files are private:
    # Django serves them only to allowed users, never nginx.
    location ~ ^/media/(resume|cover|job_applications)/ { return 404; }

    # Public uploads (company logos, profile photos)
    location /media/ {
        alias /var/www/pioduran_job/media/;
        autoindex off;
    }

    location / {
        proxy_pass http://127.0.0.1:8002;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
