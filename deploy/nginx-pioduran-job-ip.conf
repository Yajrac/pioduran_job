# /etc/nginx/sites-available/pioduran-job  (temporary: http://72.62.127.160:8080, no HTTPS)
# Port 80/443 on this IP already belong to the Water System, so this uses 8080.
server {
    listen 8080;
    server_name 72.62.127.160;

    client_max_body_size 12M;

    # Resumes, cover letters and application files are private:
    # Django serves them only to allowed users, never nginx.
    location ~ ^/media/(resume|cover|job_applications)/ { return 404; }

    # Public uploads (company logos, profile photos)
    location /media/ {
        alias /var/www/pioduran_job/media/;
        autoindex off;
    }

    location / {
        proxy_pass http://127.0.0.1:8002;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
